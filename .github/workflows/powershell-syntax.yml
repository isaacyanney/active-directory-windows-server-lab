name: PowerShell validation and Pester tests

on:
  push:
    paths:
      - "**/*.ps1"
      - "data/**/*.csv"
      - "sample-output/**/*.txt"
      - ".github/workflows/powershell-syntax.yml"
  pull_request:
    paths:
      - "**/*.ps1"
      - "data/**/*.csv"
      - "sample-output/**/*.txt"
      - ".github/workflows/powershell-syntax.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Parse PowerShell files
        shell: pwsh
        run: |
          $failed = $false

          Get-ChildItem -Path . -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "Syntax errors in $($_.FullName)"
              $errors | ForEach-Object { Write-Error $_.Message }
            }
            else {
              Write-Host "Syntax OK: $($_.FullName)"
            }
          }

          if ($failed) {
            exit 1
          }

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force

      - name: Run Pester tests
        shell: pwsh
        run: |
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = "tests"
          $configuration.Run.PassThru = $true
          $configuration.Output.Verbosity = "Detailed"
          $result = Invoke-Pester -Configuration $configuration

          if ($result.FailedCount -gt 0) {
            exit 1
          }

      - name: Validate synthetic provisioning evidence
        shell: pwsh
        run: |
          $required = @("SamAccountName","GivenName","Surname","Department","Title","OU","ManagerSam","Enabled")
          $rows = @(Import-Csv "data/users.csv")
          if ($rows.Count -eq 0) { throw "Synthetic user dataset is empty." }

          $missing = @($required | Where-Object { $_ -notin $rows[0].PSObject.Properties.Name })
          if ($missing.Count -gt 0) { throw "CSV missing columns: $($missing -join ', ')" }

          foreach ($row in $rows) {
            if ($row.SamAccountName -notmatch "^[a-z0-9._-]+$") {
              throw "Invalid synthetic account name: $($row.SamAccountName)"
            }
            if ($row.OU -notlike "*DC=corp,DC=example") {
              throw "Non-example directory path detected: $($row.OU)"
            }
          }

          $preview = Get-Content -Raw "sample-output/provisioning-preview.example.txt"
          if ($preview -notmatch "SYNTHETIC EXAMPLE") { throw "Preview is missing its synthetic-data notice." }
          if ($preview -notmatch "Changes executed: no") { throw "Preview must state that no changes were executed." }

          foreach ($account in @($rows | Select-Object -First 2)) {
            $upn = "$($account.SamAccountName)@corp.example"
            if ($preview -notmatch [regex]::Escape($upn)) {
              throw "Preview does not match the synthetic CSV account: $upn"
            }
          }

          Write-Host "Synthetic CSV and WhatIf preview evidence are consistent."
